name: Trading Report

on:
  schedule:
    - cron: '0 11 */2 * *'  # 11:00 AM UTC = ~8:00 AM hora Chile (UTC-3)
  workflow_dispatch:          # allows manual trigger from GitHub UI

permissions:
  contents: write             # needed to commit recommendations.csv back

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python main.py

      - name: Commit updated tracker CSV
        run: |
          git config user.name "TradingBot"
          git config user.email "bot@tradingbot.local"
          git add recommendations.csv
          git diff --staged --quiet || git commit -m "chore: update recommendations tracker [skip ci]"
          git push
